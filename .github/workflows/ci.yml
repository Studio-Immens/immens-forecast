name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer test

  coding-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer lint

  vendored-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored Chart.js checksum
        run: |
          expected="$(tr -d '\r\n' < assets/vendor/chart.umd.min.js.sha256)"
          actual="$(sha256sum assets/vendor/chart.umd.min.js | cut -d' ' -f1)"
          if [ "${expected,,}" != "${actual,,}" ]; then
            echo "chart.umd.min.js checksum mismatch: $expected != $actual"
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    needs: [ tests, coding-standards, vendored-assets ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Build zip
        run: bash tools/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: immens-forecast-zip
          path: dist/*.zip
